[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linktolinux-desktop"
version = "1.1.0"
description = "Link to Linux desktop client"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyGObject>=3.10",
  "segno>=1.6",
]

[project.scripts]
linktolinux = "linktolinux.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["linktolinux*"]
